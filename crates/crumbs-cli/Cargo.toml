[package]
name = "crumbs-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "crumbs"
path = "src/main.rs"

[features]
default = ["mcp"]
# `crumbs mcp`: the MCP server over stdio.
mcp = ["dep:rmcp", "dep:schemars", "dep:tokio"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crumbs-core = { version = "0.1.0", path = "../crumbs-core" }
dialoguer = "0.12.0"
rmcp = { version = "=3.9.0", optional = true, default-features = false, features = [
    "elicitation",
    "macros",
    "schemars",
    "server",
    "transport-io",
] }
schemars = { version = "1.2.3", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", optional = true, features = ["io-std", "macros", "rt", "sync"] }

[dev-dependencies]
assert_cmd = "2.2.2"
crumbs-core = { path = "../crumbs-core", features = ["test-support"] }
insta = { version = "1.49.0", features = ["json", "filters"] }
predicates = "3.1.4"
rmcp = { version = "=3.9.0", default-features = false, features = ["client"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }

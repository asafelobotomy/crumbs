[package]
name = "crumbs-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
readme = "../../README.md"
keywords = ["cleaner", "uninstaller", "linux", "cli", "mcp"]
categories = ["command-line-utilities"]

[[bin]]
name = "crumbs"
path = "src/main.rs"

[features]
default = ["mcp"]
# `crumbs mcp`: the MCP server over stdio.
mcp = ["dep:rmcp", "dep:schemars", "dep:tokio"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crumbs-core = { version = "0.4.0", path = "../crumbs-core" }
dialoguer = "0.12.0"
rmcp = { version = "=3.9.0", optional = true, default-features = false, features = [
    "elicitation",
    "macros",
    "schemars",
    "server",
    "transport-io",
] }
schemars = { version = "1.2.3", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", optional = true, features = ["io-std", "macros", "rt", "sync"] }

[dev-dependencies]
assert_cmd = "2.2.2"
crumbs-core = { path = "../crumbs-core", features = ["test-support"] }
insta = { version = "1.49.0", features = ["json", "filters"] }
predicates = "3.1.4"
rmcp = { version = "=3.9.0", default-features = false, features = ["client"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }

# The `.deb`, built by scripts/build-packages.sh with cargo-deb around the
# static musl binary: no dependencies. The `.rpm` is packaging/rpm/crumbs.spec.
[package.metadata.deb]
name = "crumbs"
maintainer = "asafelobotomy <213836723+asafelobotomy@users.noreply.github.com>"
changelog = "../../packaging/deb/changelog"
section = "utils"
priority = "optional"
revision = ""
extended-description = """\
crumBS lists the apps installed from your package manager, Flatpak, Snap and \
AppImages, and finds what each one leaves behind: configuration, caches, data \
and system files. It removes an app together with its leftovers after showing \
you exactly what will go, and cleans caches, logs, trash and orphan packages."""
assets = [
    ["target/release/crumbs", "usr/bin/crumbs", "755"],
    ["../../README.md", "usr/share/doc/crumbs/README.md", "644"],
    ["../../packaging/deb/copyright", "usr/share/doc/crumbs/copyright", "644"],
    ["../../uq/launcher/actions/crumbs-uninstall.appaction", "usr/share/uq/launcher/actions/crumbs-uninstall.appaction", "644"],
]

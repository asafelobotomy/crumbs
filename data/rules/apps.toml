# Curated leftover rules. Format: see crates/crumbs-core/src/rules.rs.
# A trailing `*` in the last path component matches every sibling with that prefix.
# Shared parents (~/.mozilla, $XDG_CACHE_HOME/mozilla) are deliberately not listed.

# Firefox
[[app]]
match = { package = ["firefox", "firefox-esr", "firefox-developer-edition", "firefox-nightly"] }
paths = ["~/.mozilla/firefox", "$XDG_CACHE_HOME/mozilla/firefox"]

# Thunderbird
[[app]]
match = { package = ["thunderbird"] }
paths = ["~/.thunderbird", "$XDG_CACHE_HOME/thunderbird"]

# Chromium
[[app]]
match = { package = ["chromium"] }
paths = ["$XDG_CONFIG_HOME/chromium", "$XDG_CACHE_HOME/chromium"]

# Google Chrome
[[app]]
match = { package = ["google-chrome"] }
paths = ["$XDG_CONFIG_HOME/google-chrome", "$XDG_CACHE_HOME/google-chrome"]

# Brave
[[app]]
match = { package = ["brave-bin", "brave-browser", "brave-origin-bin"] }
paths = ["$XDG_CONFIG_HOME/BraveSoftware", "$XDG_CACHE_HOME/BraveSoftware"]

# VS Code
[[app]]
match = { package = ["visual-studio-code-bin"] }
paths = ["$XDG_CONFIG_HOME/Code", "~/.vscode"]

# Code - OSS
[[app]]
match = { package = ["code"] }
paths = ["$XDG_CONFIG_HOME/Code - OSS", "~/.vscode-oss"]

# VSCodium
[[app]]
match = { package = ["vscodium", "vscodium-bin"] }
paths = ["$XDG_CONFIG_HOME/VSCodium", "~/.vscode-oss"]

# Cursor
[[app]]
match = { package = ["cursor-bin"], appimage = ["cursor"] }
paths = ["$XDG_CONFIG_HOME/Cursor", "~/.cursor"]

# Discord
[[app]]
match = { package = ["discord"] }
paths = ["$XDG_CONFIG_HOME/discord"]

# Spotify
[[app]]
match = { package = ["spotify"] }
paths = ["$XDG_CONFIG_HOME/spotify", "$XDG_CACHE_HOME/spotify"]

# OBS Studio
[[app]]
match = { package = ["obs-studio"] }
paths = ["$XDG_CONFIG_HOME/obs-studio"]

# GIMP
[[app]]
match = { package = ["gimp"] }
paths = ["$XDG_CONFIG_HOME/GIMP", "$XDG_CACHE_HOME/gimp"]

# Inkscape
[[app]]
match = { package = ["inkscape"] }
paths = ["$XDG_CONFIG_HOME/inkscape", "$XDG_CACHE_HOME/inkscape"]

# LibreOffice
[[app]]
match = { package = ["libreoffice-fresh", "libreoffice-still"] }
paths = ["$XDG_CONFIG_HOME/libreoffice"]

# Blender
[[app]]
match = { package = ["blender"] }
paths = ["$XDG_CONFIG_HOME/blender"]

# Godot
[[app]]
match = { package = ["godot"] }
paths = ["$XDG_CONFIG_HOME/godot", "$XDG_CACHE_HOME/godot"]

# Telegram
[[app]]
match = { package = ["telegram-desktop"] }
paths = ["$XDG_DATA_HOME/TelegramDesktop"]

# Signal
[[app]]
match = { package = ["signal-desktop"] }
paths = ["$XDG_CONFIG_HOME/Signal"]

# Slack
[[app]]
match = { package = ["slack-desktop"] }
paths = ["$XDG_CONFIG_HOME/Slack"]

# Zoom
[[app]]
match = { package = ["zoom"] }
paths = ["~/.zoom", "$XDG_CONFIG_HOME/zoomus.conf"]

# Android Studio
[[app]]
match = { package = ["android-studio"] }
paths = ["$XDG_CONFIG_HOME/Google/AndroidStudio*", "$XDG_CACHE_HOME/Google/AndroidStudio*"]

# uQ desktop: the shell's Hyprland files and generated theme. ~/.config/hypr
# itself is shared with a plain Hyprland setup and is not listed.
[[app]]
match = { package = ["uq"] }
paths = ["$XDG_CONFIG_HOME/hypr/uq", "$XDG_STATE_HOME/uq"]

# scdr: rules and imported ananicy rules. /var/lib/scdr is the daemon's own.
[[app]]
match = { package = ["scdr"] }
paths = ["/etc/scdr"]

# noti-fi: notifd's rules and history
[[app]]
match = { package = ["noti-fi"] }
paths = ["$XDG_CONFIG_HOME/notifd", "$XDG_DATA_HOME/notifd"]

# appOFholding: its library database, sandbox homes and extracted AppImages.
# The AppImages it manages are its own as well; crumBS leaves them alone.
[[app]]
match = { package = ["appofholding"], appimage = ["appofholding"] }
paths = ["$XDG_DATA_HOME/appofholding", "$XDG_CONFIG_HOME/appofholding", "$XDG_CACHE_HOME/appofholding"]

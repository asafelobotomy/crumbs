name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: scripts/check-licenses.sh
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # Release builds compile out the test hooks; build one so a cfg
      # mistake that only breaks release cannot reach main.
      - run: cargo build --workspace --release --locked

  # The Storage and cleanup page of uQ Settings (uq/pages/crumbs/): its Node and QML tests, what
  # the packages install of it, and uqctl's own check of the uq/ folder.
  uq:
    name: uQ Settings page
    runs-on: ubuntu-24.04
    env:
      UQ_TAG: v0.3.0-rc.1   # the uQ release whose `uqctl` and settings page test kit this repo follows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Qt Quick and qmltestrunner
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-layouts qml6-module-qtquick-controls \
            qml6-module-qttest qml6-module-qtqml qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window qml6-module-qtquick-templates
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Page logic and manifest tests (Node)
        run: node --test tests/uq/*.test.mjs
      # QML_XHR_ALLOW_FILE_READ lets tst_page.qml read tests/uq/fixtures/.
      - name: Page tests (QML)
        run: QML_XHR_ALLOW_FILE_READ=1 QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -import tests/uq/stub -input tests/uq
      - name: The packages install the whole uq/ folder
        run: scripts/test-packaging.sh uq_files
      - name: Cache uqctl
        id: uqctl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.uq
          key: uqctl-${{ env.UQ_TAG }}
      - name: Build uqctl
        if: steps.uqctl.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/asafelobotomy/uq --tag "$UQ_TAG" uqctl --root "$HOME/.uq"
      # `--no-programs` skips only the "program exists" check: crumbs isn't installed here. Paths
      # and everything else are still checked.
      - name: uQ integration check
        run: ~/.uq/bin/uqctl integrations check --no-programs uq/

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm rust jq gcc
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test
        run: cargo test --workspace --all-features
      - name: Build
        run: cargo build --workspace
      - name: Smoke test
        run: |
          set -u
          for args in "doctor --json" "apps list --all --json"; do
            rc=0
            out=$(./target/debug/crumbs $args) || rc=$?
            echo "crumbs $args exited $rc"
            case "$rc" in 0|3) ;; *) echo "unexpected exit code $rc"; exit 1 ;; esac
            echo "$out" | jq -e '.schema_version == 1'
          done

  # Builds, tests, smoke-tests and runs a real `crumbs uninstall sl` inside
  # each distro's container (scripts/distro-check.sh; run locally with podman).
  distro:
    name: distro (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - docker.io/library/archlinux:latest
          - docker.io/library/debian:trixie
          - docker.io/library/ubuntu:latest
          - registry.fedoraproject.org/fedora:latest
    container:
      image: ${{ matrix.image }}
    env:
      CARGO_TARGET_DIR: /target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: src
      - name: Build, test, smoke and end-to-end uninstall
        run: |
          ln -s "$GITHUB_WORKSPACE/src" /src
          sh /src/scripts/distro-check.sh --inside

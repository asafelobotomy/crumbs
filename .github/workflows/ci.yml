name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: scripts/check-licenses.sh
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # Release builds compile out the test hooks; build one so a cfg
      # mistake that only breaks release cannot reach main.
      - run: cargo build --workspace --release --locked

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm rust jq gcc
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test
        run: cargo test --workspace --all-features
      - name: Build
        run: cargo build --workspace
      - name: Smoke test
        run: |
          set -u
          for args in "doctor --json" "apps list --all --json"; do
            rc=0
            out=$(./target/debug/crumbs $args) || rc=$?
            echo "crumbs $args exited $rc"
            case "$rc" in 0|3) ;; *) echo "unexpected exit code $rc"; exit 1 ;; esac
            echo "$out" | jq -e '.schema_version == 1'
          done

  # Builds, tests, smoke-tests and runs a real `crumbs uninstall sl` inside
  # each distro's container (scripts/distro-check.sh; run locally with podman).
  distro:
    name: distro (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - docker.io/library/archlinux:latest
          - docker.io/library/debian:trixie
          - docker.io/library/ubuntu:latest
          - registry.fedoraproject.org/fedora:latest
    container:
      image: ${{ matrix.image }}
    env:
      CARGO_TARGET_DIR: /target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: src
      - name: Build, test, smoke and end-to-end uninstall
        run: |
          ln -s "$GITHUB_WORKSPACE/src" /src
          sh /src/scripts/distro-check.sh --inside

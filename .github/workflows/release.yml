name: Release

# Pushing a tag v<version> builds every artifact with scripts/release.sh and
# publishes them as a GitHub release. The AUR files (with real checksums)
# are kept as a workflow artifact for you to push to the AUR.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      CARGO_TERM_COLOR: always
      # No FUSE in the container: appimagetool runs extracted.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git rustup python github-cli rpm-tools
          rustup default 1.99.1
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the release
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/release.sh "${GITHUB_REF_NAME#v}"
      # Re-runnable: a draft left by a failed run is reused and its assets
      # replaced; the release is published only once every upload succeeded.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft \
              --title "crumBS ${tag#v}" --notes-file dist/RELEASE_NOTES.md
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/crumbs-* dist/crumbs_* dist/LICENSE dist/SHA256SUMS
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false \
            --notes-file dist/RELEASE_NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aur
          path: dist/aur/
          include-hidden-files: true
